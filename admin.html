<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#8056b4"><title>回答管理｜HP制作 ご希望シート</title><link rel="icon" href="admin-icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="admin-apple-touch-icon.png"><link rel="manifest" href="admin-manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="依頼管理"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="admin.css"></head><body><main><header><div><p class="eyebrow">HP制作 ご希望シート</p><h1>回答管理</h1></div><a href="./">入力シートへ</a></header><p id="notice" role="status" aria-live="polite"></p><section id="loginPanel" class="card"><h2>制作担当者ログイン</h2><p>管理者として登録されたSupabaseのアカウントでログインしてください。</p><form id="login"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" id="loginButton">ログイン</button></form><details style="margin-top:20px"><summary>パスワードが分からない・初めて設定する</summary><form id="recover"><label for="recoveryEmail">管理者のメールアドレス</label><input id="recoveryEmail" type="email" required autocomplete="email"><button type="submit" id="recoverButton" style="margin-top:12px">再設定メールを送る</button></form><p class="hint">届いたメールのリンクから、新しいパスワードを設定してください。</p></details><p class="hint">ログインはこのタブを閉じると解除されます。管理者以外のアカウントには回答を表示しません。</p></section><section id="dashboard" hidden><div class="toolbar"><button id="reload">更新</button><button id="logout">ログアウト</button></div><div class="filters"><label>対応状況<select id="filter"><option value="">すべて</option></select></label><label>読み込んだ回答から検索<input id="search" type="search" placeholder="活動名・連絡先"></label></div><p id="count" class="hint"></p><div id="list"></div><button id="more" hidden>さらに50件読み込む</button><div id="detail" class="card" hidden tabindex="-1"></div></section><footer>個人情報を含む回答のコピー・ダウンロードは、管理できる端末でご利用ください。</footer></main><script src="config.js"></script><script src="admin.js?v=1.4.2"></script></body></html>
